name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Prepare pinned Inno Setup compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $toolsDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\tools'
          New-Item -ItemType Directory -Force -Path $toolsDirectory | Out-Null
          $download = Join-Path $toolsDirectory 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          $expectedHash = '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F'
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Compiler download hash mismatch.' }
          if ((Get-AuthenticodeSignature -LiteralPath $download).Status -ne 'Valid') { throw 'Compiler signature invalid.' }
          $compilerDirectory = Join-Path $toolsDirectory 'InnoSetup'
          $arguments = @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/SP-', '/NORESTART', '/NOICONS', '/TASKS=""', "/DIR=`"$compilerDirectory`"")
          $prepare = Start-Process -FilePath $download -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($prepare.ExitCode -ne 0) { throw "Compiler preparation failed: $($prepare.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $compilerDirectory 'ISCC.exe'))) { throw 'Compiler missing.' }

      - name: Compile unsigned installer
        run: .\packaging\Build-Release.ps1

      - name: Upload unsigned build for review
        id: unsigned-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QxQ-CatScreenConverter-unsigned-${{ github.sha }}
          path: |
            artifacts/release/*
            LICENSE
            THIRD-PARTY-NOTICES.md
            CODE_SIGNING_POLICY.md
            PRIVACY.md
          if-no-files-found: error
          retention-days: 30

      - name: Record build outcome
        run: |
          @'
          ## Compilation completed
          The installer is unsigned. No installer execution, application launch, desktop color test, signing request, or public Release publication was performed.
          Source details and hashes are included in the artifact. SignPath integration remains pending approval and configuration.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
